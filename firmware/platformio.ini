; Finder puck firmware (ESP32-S3-WROOM-1-N8 board at the repo root).
; Build both:        pio run
; Flash one puck:    pio run -e puck_a -t upload
;
; puck_a and puck_b are the same firmware.  Each puck makes its own random ID on
; first boot and keeps it, its pairing key and its compass calibration in NVS.
; The two environments only differ in the letter shown at start-up, so a pair can
; be told apart on the bench.  If the PUCK_SECRET environment variable is set
; when building, both come out already paired with each other (see README).

[puck]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    '-DPUCK_SECRET="${sysenv.PUCK_SECRET}"'
lib_deps =
    jgromes/RadioLib@^7.1.2
    mikalhart/TinyGPSPlus@^1.1.0
    lovyan03/LovyanGFX@^1.2.7
    adafruit/Adafruit NeoPixel@^1.12.3

[env:puck_a]
extends = puck
build_flags = ${puck.build_flags} -DPUCK_LABEL=\"A\"

[env:puck_b]
extends = puck
build_flags = ${puck.build_flags} -DPUCK_LABEL=\"B\"
